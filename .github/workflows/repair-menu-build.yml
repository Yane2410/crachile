name: repair-menu-build
on:
  push:
    branches: [main]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed observer callback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/menu-page.tsx')
          s = p.read_text()
          old = 'nodes.forEach((n) => observer.observe(n); return () => observer.disconnect();'
          new = 'nodes.forEach((n) => observer.observe(n)); return () => observer.disconnect();'
          if old not in s:
              raise SystemExit('pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/menu-page.tsx
          git rm .github/workflows/repair-menu-build.yml
          git commit -m 'fix: repair menu build syntax'
          git push
